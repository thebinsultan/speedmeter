name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NetSpeedMonitor.sln

      - name: Build
        run: dotnet build NetSpeedMonitor.sln -c Release --no-restore

      - name: Test
        run: dotnet test NetSpeedMonitor.sln -c Release --no-build

      - name: Publish portable (win-x64)
        run: dotnet publish src/NetSpeedMonitor/NetSpeedMonitor.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64 /p:PublishSingleFile=true

      - name: Publish portable (win-arm64)
        run: dotnet publish src/NetSpeedMonitor/NetSpeedMonitor.csproj -c Release -r win-arm64 --self-contained true -o publish/win-arm64 /p:PublishSingleFile=true

      - name: Prepare installer inputs
        run: Copy-Item -Path LICENSE -Destination installer/LICENSE.txt -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          # Inno Setup output is not captured reliably in hosted-runner logs, so mirror
          # it into workflow-command annotations to make failures diagnosable.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "installer\NetSpeedMonitor.iss" 2>&1 | Tee-Object -FilePath iscc.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content iscc.log | Select-Object -Last 40 | ForEach-Object {
              "::error file=installer/NetSpeedMonitor.iss::$($_ -replace '%','%25' -replace '\r','' -replace '\n','%0A')"
            }
            exit $code
          }
          Get-ChildItem installer\Output | Format-Table Name, Length

      - name: Package release assets
        run: |
          Compress-Archive -Path publish/win-x64/NetSpeedMonitor.exe -DestinationPath NetSpeedMonitor-portable-win-x64.zip -Force
          Compress-Archive -Path publish/win-arm64/NetSpeedMonitor.exe -DestinationPath NetSpeedMonitor-portable-win-arm64.zip -Force
          Get-ChildItem installer/Output/*.exe, *.zip | Format-Table Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NetSpeedMonitor-portable-win-x64.zip
            NetSpeedMonitor-portable-win-arm64.zip
            installer/Output/NetSpeedMonitor-Setup-*.exe
          generate_release_notes: true
