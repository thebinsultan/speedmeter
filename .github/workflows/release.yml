name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NetSpeedMonitor.sln

      - name: Build
        run: dotnet build NetSpeedMonitor.sln -c Release --no-restore

      - name: Test
        run: dotnet test NetSpeedMonitor.sln -c Release --no-build

      - name: Publish portable (win-x64)
        run: dotnet publish src/NetSpeedMonitor/NetSpeedMonitor.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64 /p:PublishSingleFile=true

      - name: Publish portable (win-arm64)
        run: dotnet publish src/NetSpeedMonitor/NetSpeedMonitor.csproj -c Release -r win-arm64 --self-contained true -o publish/win-arm64 /p:PublishSingleFile=true

      - name: Prepare installer inputs
        run: Copy-Item -Path LICENSE -Destination installer/LICENSE.txt -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\NetSpeedMonitor.iss'

      - name: Package release assets
        run: |
          Compress-Archive -Path publish/win-x64/NetSpeedMonitor.exe -DestinationPath NetSpeedMonitor-portable-win-x64.zip -Force
          Compress-Archive -Path publish/win-arm64/NetSpeedMonitor.exe -DestinationPath NetSpeedMonitor-portable-win-arm64.zip
          Get-ChildItem installer/Output/*.exe, *.zip | Format-Table Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NetSpeedMonitor-portable-win-x64.zip
            NetSpeedMonitor-portable-win-arm64.zip
            installer/Output/NetSpeedMonitor-Setup-*.exe
          generate_release_notes: true
